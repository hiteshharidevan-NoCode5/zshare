name: Build ZShare Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate Platform Scaffolding
        run: |
          flutter create --org com.zshare . --platforms=android,linux,web

      - name: Configure Android Permissions, Intent Filters and SDK 35
        run: |
          python3 - << 'PYEOF'
          # 1. Update AndroidManifest.xml
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n"""

          intent_filters = """
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="*/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="*/*" />
                      </intent-filter>
          """

          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", permissions + "    <application")

          if "android.intent.action.SEND" not in content:
              content = content.replace("</activity>", intent_filters + "        </activity>")

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)

          # 2. Update android/app/build.gradle
          app_gradle = "android/app/build.gradle"
          with open(app_gradle, "r", encoding="utf-8") as f:
              gradle = f.read()

          gradle = gradle.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 35")
          gradle = gradle.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 35")
          gradle = gradle.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")

          with open(app_gradle, "w", encoding="utf-8") as f:
              f.write(gradle)
          print("Configurations applied successfully.")
          PYEOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ZShare-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
