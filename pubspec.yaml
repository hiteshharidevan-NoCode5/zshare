name: zshare
description: "Zero-latency, private peer-to-peer Wi-Fi file transfer utility."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.4
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  network_info_plus: ^5.0.3
  qr_flutter: ^4.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
